<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Reader – GD TECH ACADEMY</title>
<meta name="description" content="Read, search, edit, print and download your AI-generated study notes.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="siteHeader"></header>

<div class="reader-top no-print" id="readerTop" hidden>
  <div class="reader-bar" aria-hidden="true"><i id="readBar"></i></div>
  <div class="container">
    <div class="toolbar" role="toolbar" aria-label="Reader tools">
      <div class="search"><input type="search" id="findInput" placeholder="Search in notes…" aria-label="Search in notes"><button class="btn sm secondary" id="findPrev" aria-label="Previous match">↑</button><button class="btn sm secondary" id="findNext" aria-label="Next match">↓</button><span class="small muted" id="findCount"></span></div>
      <button class="btn sm secondary" id="fontDown" aria-label="Smaller text">A−</button>
      <button class="btn sm secondary" id="fontUp" aria-label="Larger text">A+</button>
      <button class="btn sm secondary" id="expandAll">Expand all</button>
      <button class="btn sm secondary" id="collapseAll">Collapse all</button>
      <button class="btn sm secondary" id="copyBtn">Copy selected</button>
      <button class="btn sm secondary" id="printBtn">🖨 Print</button>
      <button class="btn sm" id="pdfBtn">⬇ PDF</button>
      <button class="btn sm secondary" id="htmlBtn">⬇ HTML</button>
      <button class="btn sm secondary" id="saveBtn" hidden>☆ Save to My Library</button>
      <button class="btn sm secondary" id="renameBtn" hidden>✎ Rename</button>
      <button class="btn sm secondary" id="shareBtn" hidden>🌐 Publish</button>
    </div>
  </div>
</div>

<main id="main">
  <div class="container">
    <div id="state" style="padding:40px 0;text-align:center"><span class="spinner"></span> Loading notes…</div>
    <div id="reader" hidden>
      <div class="reader-layout">
        <aside class="toc no-print collapsed" id="toc" aria-label="Table of contents">
          <h3 style="font-size:1rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer" id="tocHead">Table of contents <span class="small muted" id="tocToggle">▾</span></h3>
          <ol id="tocList"></ol>
        </aside>
        <article id="article">
          <div class="note-head" id="noteHead"></div>
          <div id="contBox"></div>
          <div id="chapters"></div>
          <div class="card no-print" id="disclaimer" style="margin-top:14px"><p class="small muted" style="margin:0">AI-generated notes can contain mistakes. Please verify important facts, formulas and dates with your textbook or teacher before an exam.</p></div>
        </article>
      </div>
    </div>
  </div>
</main>
<footer id="siteFooter"></footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/markdown.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
